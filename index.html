<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lời nhắn</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#ffd6e7,#ffc0d6,#ffe4ef);
font-family:'Quicksand',sans-serif;
padding:30px;
overflow:hidden;
}

/* container */

.container{
max-width:900px;
text-align:center;
}

/* text */

#text{
font-size:clamp(24px,3vw,38px);
line-height:1.7;
white-space:pre-line;
color:#8b004f;

animation:
glow 3s ease-in-out infinite alternate,
float 4s ease-in-out infinite;
}

/* glow effect */

@keyframes glow{
from{
text-shadow:
0 0 5px #fff,
0 0 10px #ff9ac2,
0 0 20px #ff6aa6;
}
to{
text-shadow:
0 0 10px #fff,
0 0 20px #ff7ab8,
0 0 35px #ff3c96;
}
}

/* floating effect */

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0px);}
}

/* typing cursor */

.cursor{
display:inline-block;
width:3px;
background:#8b004f;
margin-left:6px;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1}
50%{opacity:0}
100%{opacity:1}
}

</style>
</head>

<body>

<div class="container">
<span id="text"></span><span class="cursor"></span>
</div>

<script>

const message = `Đừng để bị ốm, đừng để bị thương

Cố gắng ăn nhiều một chút, ngủ nhiều hơn và đừng làm việc quá sức.

Hãy sống thật vui vẻ, chăm sóc bản thân thật tốt và về nhà cẩn thận nhé...`;

let i = 0;
const speed = 45;

function typeWriter(){
if(i < message.length){
document.getElementById("text").textContent += message.charAt(i);
i++;
setTimeout(typeWriter, speed);
}
}

typeWriter();

</script>

</body>
</html>
